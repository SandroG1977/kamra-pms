name: CI/CD UnitHOS PMS (Frappe)

on:
  push:
    branches: [ "unithos-pms", "main" ]
  workflow_dispatch:
    inputs:
      target_site:
        description: "Nombre del site de Frappe a migrar (o 'all' para todos)"
        required: false
        default: "all"
      force_rebuild:
        description: "Forzar reconstrucción de imagen Docker"
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-pms-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ==============================================================================
  # 🧪 ETAPA 1: VERIFICACIÓN Y VALIDACIÓN (CI)
  # ==============================================================================
  validate:
    name: 🧪 Validate Frontend & Frappe Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validar y compilar Frontend UnitHOS PMS
        working-directory: frontend
        run: |
          npm ci
          npm run i18n:check
          npm run build

      - name: Verificar referencia de assets de producción
        run: |
          grep -q "/assets/kamra/frontend/assets/" kamra/public/frontend/index.html
          echo "✅ Assets de producción validados correctamente en index.html."

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verificar sintaxis Python e integridad de DocTypes
        run: |
          python3 -c "import ast, glob, sys; [ast.parse(open(f).read()) for f in glob.glob('kamra/**/*.py', recursive=True)]"
          echo "✅ Todos los módulos Python de Kamra/UnitHOS compilan sin errores."

  # ==============================================================================
  # 🚀 ETAPA 2: DESPLIEGUE CONTINUO EN EL SERVIDOR (CD - FRAPPE ENGINE)
  # ==============================================================================
  deploy:
    name: 🚀 Deploy to VPS & Frappe Bench Migrate
    runs-on: ubuntu-latest
    needs: validate
    environment:
      name: DEV
    steps:
      - name: Checkout de código
        uses: actions/checkout@v4

      - name: Desplegar y Migrar Frappe en VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST || secrets.DEPLOY_HOST || secrets.SSH_HOST || vars.VPS_HOST || vars.DEPLOY_HOST || vars.SSH_HOST }}
          username: ${{ secrets.VPS_USERNAME || secrets.DEPLOY_USER || secrets.SSH_USER || vars.VPS_USERNAME || vars.DEPLOY_USER || vars.SSH_USER || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY || secrets.DEPLOY_SSH_KEY || secrets.SSH_KEY || vars.VPS_SSH_KEY || vars.DEPLOY_SSH_KEY || vars.SSH_KEY }}
          port: ${{ secrets.VPS_PORT || secrets.DEPLOY_PORT || vars.VPS_PORT || vars.DEPLOY_PORT || 22 }}
          timeout: 60s
          command_timeout: 45m
          script_stop: true
          script: |
            set -euo pipefail
            echo "=========================================================="
            echo "🏨 INICIANDO DESPLIEGUE: UnitHOS PMS (Frappe Framework)"
            echo "Host: $(hostname) | Usuario: $(whoami) | Fecha: $(date)"
            echo "=========================================================="

            cd /opt/kamra

            echo "🔄 1. Actualizando repositorio en backend..."
            sudo docker compose -p kamra exec -T backend bash -c "git config --global --add safe.directory /home/frappe/frappe-bench/apps/kamra 2>/dev/null || true; cd /home/frappe/frappe-bench/apps/kamra && git fetch origin unithos-pms && git checkout -f unithos-pms && git reset --hard origin/unithos-pms"

            echo "🎨 2. Compilando frontend (Vite)..."
            sudo docker compose -p kamra exec -T -u frappe backend bash -c "cd /home/frappe/frappe-bench/apps/kamra/frontend && npm run build"

            echo "📦 3. Sincronizando assets estáticos..."
            sudo rm -rf /tmp/kamra_frontend
            sudo docker cp kamra-backend-1:/home/frappe/frappe-bench/apps/kamra/kamra/public/frontend /tmp/kamra_frontend
            sudo docker cp /tmp/kamra_frontend/. kamra-frontend-1:/home/frappe/frappe-bench/apps/kamra/kamra/public/frontend/
            sudo rm -rf /tmp/kamra_frontend
            sudo docker exec kamra-frontend-1 nginx -s reload || true

            echo "⚡ 4. Migrando bases de datos..."
            sudo docker compose -p kamra exec -T backend bench --site all migrate

            echo "🧹 5. Limpiando caché Redis..."
            sudo docker compose -p kamra exec -T backend bench --site all clear-cache

            echo "🔄 6. Reiniciando backend y workers..."
            sudo docker compose -p kamra restart backend scheduler queue-short queue-long

            echo "=========================================================="
            echo "✅ DESPLIEGUE DE UNITHOS PMS Y FRAPPE FINALIZADO CON ÉXITO"
            echo "=========================================================="
